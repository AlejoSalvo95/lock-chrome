<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil bloqueado</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <div class="lock-icon" aria-hidden="true">🔒</div>
    <h1 id="title">Perfil protegido</h1>
    <p id="description">Ingresá la contraseña para habilitar la navegación.</p>

    <form id="loginForm">
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        autofocus
      />
      <div id="confirmGroup" hidden>
        <label for="confirmPassword">Repetí la contraseña</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
        />
      </div>
      <button id="submitButton" type="submit">Desbloquear</button>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
